name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "35 13 * * 3"
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK for Android/Kotlin
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        id: gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Gradle wrapper..."
          find . -maxdepth 5 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print

          GRADLEW_PATH="$(find . -maxdepth 5 -type f -name gradlew | head -n 1 || true)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "No Gradle wrapper found. Please commit a gradlew file or adjust the CodeQL build step to your real Android project path."
            exit 1
          fi

          GRADLE_DIR="$(dirname "$GRADLEW_PATH")"
          echo "Found Gradle wrapper at: $GRADLEW_PATH"
          echo "gradle-dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      - name: Make Gradle wrapper executable
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: chmod +x "${{ steps.gradle.outputs.gradle-dir }}/gradlew"

      - name: Build Android project for CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        working-directory: ${{ steps.gradle.outputs.gradle-dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
