name: Windows CI

on:
  push:
    branches:
      - main
      - Security-Changes-Test
      - 'security/**'
      - 'test/**'
  pull_request:
    branches:
      - main
      - Security-Changes-Test
      - 'security/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: |
          Set-Location .\fhplayer_flutter
          flutter pub get

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            '.\build_windows.ps1',
            '.\build_windows_installer.ps1',
            '.\build_windows_release.ps1',
            '.\scripts\android_flutter\build_debug_apk.ps1',
            '.\scripts\android_flutter\install_debug_apk.ps1',
            '.\scripts\android_flutter\build_release_artifacts.ps1',
            '.\scripts\test_flutter.ps1',
            '.\scripts\run_flutter_logged.ps1',
            '.\scripts\smoke_test.ps1',
            '.\scripts\release_check.ps1'
          )
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell parse failed for $file"
            }
          }

      - name: Run Flutter tests
        shell: pwsh
        run: .\scripts\test_flutter.ps1 -Reporter compact

      - name: Run Flutter analyze
        shell: pwsh
        run: |
          Set-Location .\fhplayer_flutter
          flutter analyze

      - name: Run Windows smoke tests (without installer and Android)
        shell: pwsh
        env:
          FHPLAYER_NO_PAUSE: "1"
        run: .\scripts\smoke_test.ps1 -SkipWindowsInstaller -SkipAndroid -SkipAndroidInstall
