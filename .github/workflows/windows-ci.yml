name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check Python syntax
        shell: pwsh
        env:
          PYTHONPYCACHEPREFIX: .tmp/pythoncache
        run: python -m py_compile app.py

      - name: Check frontend syntax
        shell: pwsh
        run: node --check .\static\playlist-app.js

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            '.\build_windows.ps1',
            '.\build_windows_installer.ps1',
            '.\FHPlayerMobile\android\build_debug_apk.ps1',
            '.\FHPlayerMobile\android\install_debug_apk.ps1',
            '.\scripts\smoke_test.ps1',
            '.\scripts\test_rule_engine.ps1'
          )
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell parse failed for $file"
            }
          }

      - name: Run rule-engine tests
        shell: pwsh
        run: .\scripts\test_rule_engine.ps1

      - name: Run desktop and Windows EXE smoke tests
        shell: pwsh
        env:
          FHPLAYER_NO_PAUSE: "1"
        run: .\scripts\smoke_test.ps1 -SkipWindowsInstaller -SkipAndroid -SkipAndroidInstall
