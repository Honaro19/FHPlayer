name: 💡 Feature Request
description: Suggest an idea or improvement for FHPlayer
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe your idea as clearly as possible.

  - type: textarea
    id: idea
    attributes:
      label: Idea Description
      description: What would you like to see added or improved?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Do you have an idea how this could be implemented?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there alternative approaches?

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
