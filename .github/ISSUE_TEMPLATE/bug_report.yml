name: 🐛 Bug Report
description: Report a problem or unexpected behavior in FHPlayer
title: "[BUG] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below as accurately as possible.

  - type: input
    id: version
    attributes:
      label: App Version
      description: Which version are you using?
      placeholder: e.g. 0.1.2
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android (APK)
        - Android (AAB)
    validations:
      required: true

  - type: dropdown
    id: install_type
    attributes:
      label: Installation Type (Windows only)
      options:
        - Setup (Installer)
        - Portable Version
        - Not applicable
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System / Android Version
      description: |
        Examples:
        - Windows 10 / Windows 11
        - Android 13 / Android 14
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device (Android only)
      description: e.g. Samsung Galaxy S21
      placeholder: Optional for Windows users

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Start the app
        2. Tap on ...
        3. ...
        4. Error occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Attach logs, screenshots, or crash reports if available

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
