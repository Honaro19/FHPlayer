name: 📱 Android Bug Report
description: Report a bug in the Android version of FHPlayer
title: "[BUG][Android] "
labels: ["bug", "android"]

body:
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g. 0.1.2
    validations:
      required: true

  - type: dropdown
    id: build_type
    attributes:
      label: Build Type
      options:
        - APK
        - AAB
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android Version
      placeholder: e.g. Android 13
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Samsung Galaxy S21
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open app
        2. Tap ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
